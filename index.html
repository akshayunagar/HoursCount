<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekend Club hours</title>
<meta name="apple-mobile-web-app-title" content="Hours">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E6ECF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111733" media="(prefers-color-scheme: dark)">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--paper:#E6ECF1;--card:#F7F9FB;--ink:#1B2550;--muted:#5D6787;--line:#C3CCD9;--stamp:#5A3EA6;--soft:#E4DDF5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#111733;--card:#1A2146;--ink:#E7EBF7;--muted:#9AA3C4;--line:#2E3766;--stamp:#B7A3F0;--soft:#2C2758}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:620px;margin:0 auto;padding:24px 16px 48px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:6px}

.month{display:flex;align-items:center;justify-content:space-between;margin:8px 0 20px}
.month h1{margin:0;font-stretch:110%;font-weight:800;font-size:clamp(1.4rem,6.5vw,2rem);text-align:center}
.nav{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:1.2rem}

h2{font-stretch:110%;font-weight:750;font-size:1.1rem;margin:26px 0 10px}
form{padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
input{-webkit-appearance:none;appearance:none;display:block;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;
  padding:14px;min-height:54px;height:54px;line-height:24px;font-size:17px;width:100%;min-width:0;max-width:100%;text-align:left;margin:0}
/* iPhone: keep date and time text vertically centred, even when empty */
@supports (-webkit-touch-callout: none){input[type="date"],input[type="time"]{display:flex;align-items:center}}
input::-webkit-date-and-time-value{text-align:left;margin:0;padding:0;line-height:24px;min-height:24px}
input::-webkit-datetime-edit{padding:0;line-height:24px}
input::-webkit-calendar-picker-indicator{opacity:.6}
input:focus{border-color:var(--stamp);outline:none;box-shadow:0 0 0 3px var(--soft)}
label{min-width:0}
.foot{grid-column:1/-1;display:flex;flex-direction:column;gap:10px}
.preview{color:var(--muted);text-align:center;min-height:1.45em}
.preview b{color:var(--ink)}
.primary{background:var(--stamp);color:#fff;border:0;border-radius:8px;height:54px;width:100%;font-weight:700;font-size:1.05rem;cursor:pointer}
@media (prefers-color-scheme: dark){.primary{color:#141A3A}}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:0 16px;height:46px;cursor:pointer}
.foot .ghost{width:100%}

ul{list-style:none;margin:0;padding:0}
li.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:14px 16px;border-top:1px dashed var(--line)}
li.row:first-child{border-top:0}
.when b{font-weight:700}
.when small{display:block;color:var(--muted)}
.amt{text-align:right;font-weight:700}
.amt small{display:block;font-weight:400;color:var(--muted)}
.row .acts{grid-column:1/-1;display:flex;gap:6px;margin-top:4px}
.x{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer;padding:6px 14px;font-size:.85rem}
.x:hover{color:var(--ink)}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}

.total{margin-top:16px;padding:18px 20px;display:grid;gap:10px;border:2.5px solid var(--stamp);border-radius:10px;background:var(--soft)}
.total div{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.total div+div{border-top:1px solid var(--line);padding-top:10px}
.total span{color:var(--muted);font-size:1rem}
.total b{white-space:nowrap;font-stretch:80%;font-weight:900;font-size:clamp(1.9rem,9vw,2.6rem);line-height:1.1;color:var(--stamp)}
.total b.small{font-size:clamp(1.5rem,7vw,2rem)}
.total p{grid-column:1/-1;margin:0;color:var(--muted);font-size:.85rem}

details{margin-top:34px}
summary{cursor:pointer;color:var(--muted)}
.set{padding:16px;margin-top:10px;display:grid;gap:14px}
.band{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 80px;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:5px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">

  <div class="month">
    <button class="nav" id="prev" aria-label="Previous month">‹</button>
    <h1 id="title">Month</h1>
    <button class="nav" id="next" aria-label="Next month">›</button>
  </div>

  <form class="card" id="form" autocomplete="off">
    <label class="full">Date<input type="date" id="fDate" required></label>
    <label>Start<input type="time" id="fStart" required></label>
    <label>End<input type="time" id="fEnd" required></label>
    <label class="full">Break (minutes)<input type="number" id="fBreak" min="0" step="5" value="0" inputmode="numeric"></label>
    <div class="foot">
      <span class="preview" id="preview"></span>
      <button type="submit" class="primary" id="saveBtn">Add shift</button>
      <button type="button" class="ghost" id="cancel" hidden>Cancel</button>
    </div>
  </form>

  <h2>My shifts</h2>
  <div class="card"><ul id="rows"></ul></div>

  <section class="card total" aria-live="polite">
    <div><span>Total hours</span><b id="totH" class="small">0</b></div>
    <div><span>Total salary</span><b id="totP">€0</b></div>
    <p id="totNote"></p>
  </section>

  <details>
    <summary>Settings</summary>
    <div class="card set">
      <label>Hourly wage (€)<input type="number" id="sRate" min="0" step="0.01" inputmode="decimal"></label>
      <div id="bands"></div>
    </div>
  </details>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const KEY="wc-hours-v1";
  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const defBands=()=>[{from:"21:00",to:"00:00",pct:25},{from:"00:00",to:"03:00",pct:40},{from:"03:00",to:"06:00",pct:25}];
  let state={v:2,settings:{rate:"13.90",brk:0,bands:defBands()},shifts:[]};
  const now=new Date(); let view={y:now.getFullYear(),m:now.getMonth()}; let editing=null;
  const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,"0");
  const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
  const toMin=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m;};
  const rate=()=>parseFloat(state.settings.rate)||0;
  const fH=h=>(Math.round(h*100)/100).toLocaleString("en-GB",{maximumFractionDigits:2});
  const fE=n=>"€"+n.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});
  function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2000);}

  function normalize(){
    const s=state.settings||{};
    state.settings={rate:s.rate||"13.90",brk:s.brk||0,bands:Array.isArray(s.bands)?s.bands:defBands()};
    if(!Array.isArray(state.shifts))state.shifts=[];
  }
  function load(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&Array.isArray(p.shifts))state=p;}}catch(e){}normalize();}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast("Couldn't save. Is browser storage turned off?");}}

  // Hours of a shift, and extra (bonus) hours from night times. Breaks are taken off evenly across the shift.
  function calc(s){
    const a=toMin(s.start),e=toMin(s.end); if(a==null||e==null) return {hours:0,bonusH:0,pay:0};
    let b=e; if(b<=a) b+=1440;
    const raw=b-a, worked=Math.max(0,raw-(Number(s.brk)||0)), f=worked/raw;
    let bonusH=0;
    state.settings.bands.forEach(bd=>{
      let fs=toMin(bd.from),fe=toMin(bd.to); if(fs==null||fe==null) return;
      if(fe<=fs) fe+=1440; let m=0;
      for(const o of[-1440,0,1440]) m+=Math.max(0,Math.min(b,fe+o)-Math.max(a,fs+o));
      bonusH+=m*f/60*(Number(bd.pct)||0)/100;
    });
    const hours=worked/60; return {hours,bonusH,pay:(hours+bonusH)*rate(),bonus:bonusH*rate()};
  }

  function monthShifts(){const k=view.y+"-"+pad(view.m+1);return state.shifts.filter(s=>s.date.startsWith(k)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));}

  function render(){
    $("title").textContent=MONTHS[view.m]+" "+view.y;
    const list=monthShifts(), ul=$("rows"); ul.innerHTML="";
    let H=0,P=0,B=0;
    if(!list.length){const li=document.createElement("li");li.className="empty";li.textContent="No shifts yet this month.";ul.appendChild(li);}
    list.forEach(s=>{
      const c=calc(s); H+=c.hours; P+=c.pay; B+=c.bonus;
      const d=new Date(s.date+"T12:00:00");
      const li=document.createElement("li"); li.className="row";
      const w=document.createElement("div"); w.className="when";
      const b=document.createElement("b"); b.textContent=DOW[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3);
      const sm=document.createElement("small"); sm.textContent=s.start+" – "+s.end+(Number(s.brk)?", "+s.brk+" min break":"");
      w.append(b,sm);
      const amt=document.createElement("div"); amt.className="amt"; amt.textContent=fE(c.pay);
      const hs=document.createElement("small"); hs.textContent=fH(c.hours)+" h"; amt.appendChild(hs);
      const acts=document.createElement("div"); acts.className="acts";
      const eb=document.createElement("button"); eb.className="x"; eb.textContent="Edit"; eb.onclick=()=>edit(s.id);
      const db=document.createElement("button"); db.className="x"; db.textContent="Delete"; db.onclick=()=>del(s.id);
      acts.append(eb,db);
      li.append(w,amt,acts); ul.appendChild(li);
    });
    $("totH").textContent=fH(H);
    $("totP").textContent=fE(P);
    $("totNote").textContent=list.length? list.length+" shift"+(list.length>1?"s":"")+" in "+MONTHS[view.m]+", including "+fE(B)+" night bonus":"";
  }

  function preview(){
    const s={start:$("fStart").value,end:$("fEnd").value,brk:$("fBreak").value};
    if(!s.start||!s.end){$("preview").textContent="";return;}
    const c=calc(s); $("preview").innerHTML="<b></b>"; $("preview").firstChild.textContent=fH(c.hours)+" h = "+fE(c.pay);
  }
  function reset(){editing=null;$("fDate").value=today();$("fStart").value="";$("fEnd").value="";$("fBreak").value=state.settings.brk||0;$("saveBtn").textContent="Add shift";$("cancel").hidden=true;preview();}
  function edit(id){const s=state.shifts.find(x=>x.id===id);if(!s)return;editing=id;$("fDate").value=s.date;$("fStart").value=s.start;$("fEnd").value=s.end;$("fBreak").value=s.brk||0;$("saveBtn").textContent="Save changes";$("cancel").hidden=false;preview();window.scrollTo({top:0,behavior:"smooth"});}
  function del(id){const s=state.shifts.find(x=>x.id===id);if(!s||!confirm("Delete the shift on "+s.date+"?"))return;state.shifts=state.shifts.filter(x=>x.id!==id);if(editing===id)reset();save();render();toast("Shift deleted");}

  $("form").addEventListener("submit",e=>{
    e.preventDefault();
    const s={date:$("fDate").value,start:$("fStart").value,end:$("fEnd").value,brk:Math.max(0,parseInt($("fBreak").value,10)||0)};
    if(calc(s).hours<=0){toast("Check the times: the break is longer than the shift");return;}
    if(editing){const i=state.shifts.findIndex(x=>x.id===editing);if(i>-1)state.shifts[i]=Object.assign({},state.shifts[i],s);toast("Shift updated");}
    else{state.shifts.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)},s));toast("Shift added");}
    const d=new Date(s.date+"T12:00:00"); view={y:d.getFullYear(),m:d.getMonth()};
    save(); reset(); render();
  });
  ["fStart","fEnd","fBreak"].forEach(id=>$(id).addEventListener("input",preview));
  $("cancel").onclick=reset;
  $("prev").onclick=()=>{view.m--;if(view.m<0){view.m=11;view.y--;}render();};
  $("next").onclick=()=>{view.m++;if(view.m>11){view.m=0;view.y++;}render();};

  // Settings
  function renderBands(){
    const box=$("bands"); box.innerHTML="";
    const t=document.createElement("span"); t.style.cssText="font-size:.85rem;color:var(--muted)"; t.textContent="Night bonus times"; box.appendChild(t);
    state.settings.bands.forEach(bd=>{
      const row=document.createElement("div"); row.className="band"; row.style.marginTop="6px";
      [["From","time","from"],["To","time","to"],["Bonus %","number","pct"]].forEach(([lab,type,k])=>{
        const l=document.createElement("label"); l.textContent=lab; const i=document.createElement("input"); i.type=type; i.value=bd[k];
        i.oninput=()=>{bd[k]=i.value;save();render();preview();}; l.appendChild(i); row.appendChild(l);
      });
      box.appendChild(row);
    });
  }
  $("sRate").oninput=()=>{state.settings.rate=$("sRate").value;save();render();preview();};
  load(); $("sRate").value=state.settings.rate; renderBands(); reset(); render();
})();
</script>
</body>
</html>
